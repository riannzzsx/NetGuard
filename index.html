
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetGuard - Dashboard NOC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="brand-logo">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            </div>
            <span>Net<span style="color: var(--accent-cyan);">Guard</span></span>
        </div>
        <div class="header-actions">
            <button class="btn-primary" type="button" id="btnCadastrarHost">+ Cadastrar Host</button>
        </div>
    </header>

    <section class="metrics-grid">
        <div class="card">
            <div class="card-title">Ativos Totais</div>
            <div class="card-value" id="totalHosts">0</div>
        </div>
        <div class="card">
            <div class="card-title">Dispositivos Online</div>
            <div class="card-value" style="color: var(--online-color);" id="onlineHosts">0</div>
        </div>
        <div class="card">
            <div class="card-title">Ativos Offline</div>
            <div class="card-value" style="color: var(--offline-color);" id="offlineHosts">0</div>
        </div>
        <div class="card">
            <div class="card-title">Latência Média</div>
            <div class="card-value" style="color: var(--accent-cyan);" id="avgLatency">-- ms</div>
        </div>
    </section>

    <div class="dashboard-layout">
        <div class="card">
            <div class="section-header">
                <div class="section-title">Nós da Rede (Hosts)</div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Status</th>
                            <th>Host / Dispositivo</th>
                            <th>Endereço IP</th>
                            <th>Latência</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="hostsTableBody">
                        <tr><td colspan="5" style="text-align: center;">Carregando dados...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="section-header">
                <div class="section-title">Tempo de Resposta (ICMP)</div>
            </div>
            <div class="chart-box">
                <canvas id="latencyChart"></canvas>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="hostModal">
        <div class="modal-content">
            <div class="modal-header">Novo Host de Rede</div>
            <form id="hostForm">
                <div class="form-group">
                    <label for="hostName">Nome do Dispositivo</label>
                    <input type="text" id="hostName" placeholder="Ex: Servidor Web" required>
                </div>
                <div class="form-group">
                    <label for="hostAddress">Endereço (IP ou Domínio)</label>
                    <input type="text" id="hostAddress" placeholder="Ex: 192.168.1.100" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btnCancelar">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar Host</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
